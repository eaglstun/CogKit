# Apple Silicon (MPS) single-device smoke/dev config — cogview4-6b LoRA.
# Differences from config.yaml: strategy SINGLE, no dataloader workers (fork on
# macOS), no pin_memory (CUDA-only), tiny in-repo dataset, no validation.

# ================ Logging ================
name4train: "t2i-train-mps"
log_level: "INFO"

# ================ Model ================
model_name: "cogview4-6b"
model_path: "THUDM/CogView4-6B"

# ================ Output ================
output_dir: "train_result_mps"

# ================ Tracker ================
report_to: null

# ================ Data ================
data_root: "../../data/t2i"

# ================ Training ================
seed: 42
training_type: "lora"

# SINGLE = single-device lane (MPS/CPU): no FSDP/DDP wrapping
strategy: "SINGLE"

offload_params_grads: false
no_grad_sync_when_accumulating: false

# See config.yaml — clear data_root/{train,test}/.cache when flipping this
enable_packing: false

# QLoRA/bitsandbytes is CUDA-only; must stay false on MPS
low_vram: false

# CogView4: height/width must be multiples of 32
train_resolution: [512, 512]  # [Height, Width]

train_epochs: 1
batch_size: 1
gradient_accumulation_steps: 1
mixed_precision: "bf16"
learning_rate: 2.0e-5

# Opt-in synchronized phase timing. Set profile_steps > 0 only for benchmark runs;
# explicit MPS synchronization intentionally slows the profiled steps.
profile_warmup_steps: 1
profile_steps: 4

# fork-based dataloader workers are unreliable on macOS; keep in-process
num_workers: 0
pin_memory: false

checkpointing_steps: 5
checkpointing_limit: 2
resume_from_checkpoint: null

# ================ Validation ================
do_validation: false
validation_steps: null
