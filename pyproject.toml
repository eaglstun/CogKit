[project]
name = 'cogkit'
dynamic = ['version']
description = ''
readme = 'README.md'
requires-python = '>=3.10'
license-files = ["LICENSE"]
keywords = []
authors = [{ name = 'ZhipuAI', email = 'opensource@zhipuai.cn' }]
# TODO: adds maintainers
# maintainers = []
dependencies = [
  "click~=8.1",
  # Pinned: diffusers main moved to huggingface-hub>=1.26, which transformers 4.x caps
  # below 1.0 — git-main no longer resolves against this dependency set on any Python.
  "diffusers @ git+https://github.com/huggingface/diffusers.git@b8905b9b0f01d2df8738ae967d5c02c502f0d3e5",
  "imageio-ffmpeg~=0.6.0",
  "imageio~=2.37",
  # diffusers@git-main requires peft>=0.17
  "peft>=0.17.0",
  "pydantic~=2.10",
  # 0.2.0 ships no cp314 wheel; 0.2.2 does
  "sentencepiece==0.2.2",
  "transformers~=4.49",
  "fastapi[standard]~=0.115.11",
  "fastapi_cli~=0.0.7",
  "openai~=1.67",
  "pydantic_settings~=2.8.1",
  "python-dotenv~=1.0",
  "gradio~=5.23",
  "python-slugify~=8.0",
]

[project.optional-dependencies]
finetune = [
  # datasets<5 caps dill<0.3.9, and dill before 0.4.1 overrides pickle's
  # _batch_setitems with the 2-arg signature Python 3.14 replaced.
  "datasets~=5.0",
  "wandb~=0.19.8",
  # 14.x ships no cp314 wheel; 15.1 does
  "av~=15.1",
  # No macOS/arm64 bitsandbytes wheel is published, so it stays off the darwin dependency
  # set. QLoRA on Apple Silicon needs a source build with Metal kernels
  # (`cmake -DCOMPUTE_BACKEND=mps -S . && make`, then `pip install -e .`); `low_vram` probes
  # for a working 4-bit backend at trainer startup rather than testing sys.platform.
  "bitsandbytes~=0.45.4; sys_platform != 'darwin'",
  "pyyaml>=6.0.2",
]

[project.urls]
"Repository" = "https://github.com/THUDM/CogKit"


[project.scripts]
cogkit = "cogkit.cli:cli"


[build-system]
requires = [
  "hatchling",
  # * uses vcs (e.g. git) to determine the package version
  "hatch-vcs",
]
build-backend = "hatchling.build"


[dependency-groups]
dev = ["mypy~=1.15", "ruff~=0.11.0"]


[tool.hatch.version]
source = 'vcs'


[tool.hatch.version.raw-options]
version_scheme = 'python-simplified-semver'
local_scheme = 'no-local-version'


[tool.hatch.build.hooks.vcs]
version-file = 'src/cogkit/_version.py'


[tool.hatch.metadata]
allow-direct-references = true


[tool.pdm]
distribution = true


[tool.pdm.scripts]
lint.cmd = [
  "ruff",
  #
  "check",
]
typecheck.cmd = [
  "mypy",
  # options
  # "--install-types",
  "--non-interactive",
  # dirs
  "src/cogkit",
  "tests",
]


[tool.ruff]
# https://github.com/astral-sh/ruff/issues/8627
exclude = [".git", ".mypy_cache", ".ruff_cache", ".venv", "dist"]
target-version = "py310"
line-length = 100
indent-width = 4


[tool.ruff.format]
line-ending = "lf"
quote-style = "double"
indent-style = "space"
